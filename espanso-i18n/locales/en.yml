    about: "List and execute matches from the CLI"
    list: "Print matches to standard output"
    exec: "Triggers the expansion of a match"
    help:
      json: "Output matches to the JSON format"
      only_triggers: "Print only triggers without replacement"
      preserve_newlines: "Preserve newlines when printing replacements. Does nothing when using JSON format."
      class: "Only return matches that would be active with the given class. This is relevant if you want to list matches only active inside an app-specific config."
      title: "Only return matches that would be active with the given title. This is relevant if you want to list matches only active inside an app-specific config."
      exec: "Only return matches that would be active with the given exec. This is relevant if you want to list matches only active inside an app-specific config."
