    about: "Start the daemon without spawning a new process."
  log:
    about: "Print the daemon logs."
  stats:
    about: "Show expansion statistics"
    help:
      period: "Limit to period: today|week|month|year|all (default all)"
      count: "Top N triggers to show (default 10)"
      json: "Output as JSON"
      grep: "Filter triggers by SQL LIKE pattern, e.g., :td%"
      days: "Days to keep (default 180)"
    clear: "Clear the stats database"
    prune: "Delete records older than N days"
  modulo:
    form: "Display a customizable form"
    search: "Display a search box"
    textview: "Display a Text View"
    troubleshoot: "Display the troubleshooting GUI"
    welcome: "Display the welcome screen"
    help:
      input_file: "Input file or - for stdin"
      json: "Interpret the input data as JSON"
      title: "Window title to display"
  path:
    about: "Prints all the espanso directory paths to easily locate configuration and matches."
    config: "Print the current config folder path."
    packages: "Print the current packages folder path."
    data: "Print the current data folder path."
    runtime: "Print the current runtime folder path."
    default: "Print the default configuration file path."
    base: "Print the default match file path."
  service:
    about: "A collection of commands to manage the Espanso service (for example, enabling auto-start on system boot)."
    register: "Register espanso as a system service"
    unregister: "Unregister espanso from system services"
    check: "Check if espanso is registered as a system service"
    start: "Start espanso as a service"
    restart: "Restart the espanso service"
    stop: "Stop espanso service"
    status: "Check if the espanso daemon is running or not."
    help:
      unmanaged: "Run espanso as an unmanaged service (avoid system manager)"
