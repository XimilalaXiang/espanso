      git_branch: "Force espanso to search for the package on a specific git branch"
      force: "Overwrite the package if already installed"
      refresh_index: "Request a fresh copy of the Espanso Hub package index instead of using the cached version."
      use_native_git: "If specified, espanso will use the 'git' command instead of trying direct methods."
  workaround:
    about: "A collection of workarounds to solve some common problems."
    secure_input: "Attempt to disable secure input by automating the common steps."
